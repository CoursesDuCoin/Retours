name: 🐞 Signaler une erreur
description: Date, lieu ou catégorie faux, course annulée, course manquante, problème sur le site
title: "[Erreur] "
labels: ["erreur"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Les tickets sont publics : n'indiquez aucune information personnelle.
  - type: dropdown
    id: type
    attributes:
      label: Type de problème
      options:
        - Information fausse sur une course
        - Course annulée ou reportée
        - Course manquante
        - Problème d'affichage ou de fonctionnement du site
        - Autre
    validations:
      required: true
  - type: input
    id: course
    attributes:
      label: Page de la course
      description: Adresse de la page sur coursesducoin.fr (laisser vide pour une course manquante ou un problème du site)
      placeholder: https://www.coursesducoin.fr/courses/…
  - type: textarea
    id: description
    attributes:
      label: Ce qui ne va pas
      description: Ce qui est affiché, ce qui devrait l'être, et votre source si possible (lien vers le site du club, de la fédération…)
    validations:
      required: true
