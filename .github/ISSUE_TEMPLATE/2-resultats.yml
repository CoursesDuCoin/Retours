name: 🏆 Proposer un lien vers les résultats
description: Des résultats publiés sur le site d'un club, d'un chronométreur ou d'une fédération
title: "[Résultats] "
labels: ["résultats"]
body:
  - type: markdown
    attributes:
      value: |
        Une fois relu, le lien est ajouté automatiquement sur la page de la course.
  - type: input
    id: course
    attributes:
      label: Page de la course
      description: Adresse de la page sur coursesducoin.fr
      placeholder: https://www.coursesducoin.fr/courses/…
    validations:
      required: true
  - type: input
    id: lien
    attributes:
      label: Lien vers les résultats
      description: Adresse commençant par https:// (page web ou PDF)
      placeholder: https://…
    validations:
      required: true
  - type: input
    id: libelle
    attributes:
      label: Catégorie concernée (facultatif)
      description: Si le lien ne couvre qu'une catégorie, par ex. « U17 » ou « Élite »
  - type: textarea
    id: commentaire
    attributes:
      label: Commentaire (facultatif)
