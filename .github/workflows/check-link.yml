# Vérifie que le lien d'un ticket « tracé » ou « résultats » s'ouvre sans être connecté.
# OK → étiquette « lien-vérifié » (un humain relit puis pose « validé »).
# KO → commentaire expliquant le problème + étiquette « à-corriger ».
name: Vérification du lien

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: Numéro du ticket à vérifier
        required: true

permissions:
  issues: write

concurrency:
  group: check-link-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le lien
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          set -uo pipefail
          labels=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | join(",")')
          case ",$labels," in
            *,tracé,*|*,résultats,*) ;;
            *) echo "Ni tracé ni résultats : rien à vérifier"; exit 0 ;;
          esac

          # Lien = première ligne http(s) de la section « ### Lien vers … »
          link=$(gh issue view "$ISSUE" --json body --jq .body | tr -d '\r' \
            | awk '/^### /{insec = ($0 ~ /^### Lien vers/); next} insec && /^https?:\/\//{print $1; exit}')

          reason=""
          unknown=""
          host=$(echo "$link" | sed -E 's#^https?://([^/:?#]+).*#\1#' | tr 'A-Z' 'a-z' | sed 's/^www\.//')
          # Tracé : le lien doit mener vers un site de parcours connu
          if [ -n "$link" ] && [[ ",$labels," == *,tracé,* ]]; then
            case "$host" in
              openrunner.com|*.openrunner.com|komoot.com|*.komoot.com|komoot.fr|*.komoot.fr|komoot.de|\
              ridewithgps.com|*.ridewithgps.com|strava.com|*.strava.com|strava.app.link|\
              visorando.com|*.visorando.com|wikiloc.com|*.wikiloc.com|alltrails.com|*.alltrails.com|\
              outdooractive.com|*.outdooractive.com|tracegps.com|*.tracegps.com|utagawavtt.com|*.utagawavtt.com|\
              connect.garmin.com|gpsies.com|*.gpsies.com|calimoto.com|*.calimoto.com|bikemap.net|*.bikemap.net|\
              plotaroute.com|*.plotaroute.com|veloenfrance.fr|*.veloenfrance.fr|openstreetmap.org|*.openstreetmap.org|\
              geovelo.app|*.geovelo.app|geovelo.fr|*.geovelo.fr|cartovelo.fr|*.cartovelo.fr) ;;
              *) unknown="yes" ;;
            esac
          fi

          if [ -z "$link" ]; then
            reason="Aucun lien trouvé dans le ticket (il doit commencer par https://)."
          else
            echo "Lien : $link"
            result=$(curl -sSL --max-time 20 --max-redirs 5 -o page.html \
              -A "Mozilla/5.0 (compatible; CoursesDuCoinBot/1.0; +https://www.coursesducoin.fr)" \
              -w '%{http_code} %{url_effective}' "$link" 2>/dev/null) || result="000 $link"
            code=${result%% *}
            final=${result#* }
            echo "Réponse : $code $final"
            if [ "$code" = "000" ]; then
              reason="Le lien ne répond pas (site injoignable ou adresse incorrecte)."
            elif [ "$code" -ge 400 ]; then
              reason="Le lien renvoie une erreur $code (page introuvable ou privée)."
            elif echo "$final" | grep -Eiq '/(login|signin|sign-in|connexion|session|auth|account/login)([/?#]|$)'; then
              reason="Le lien redirige vers une page de connexion : il n'est pas public."
            # Strava : accepté tel quel (lien simple sur le site, sans carte), sa page contient un formulaire de connexion
            elif [[ "$host" != *strava* ]] && grep -Eiq 'type=["'\'']?password' page.html; then
              reason="La page demande un mot de passe : le lien n'est pas public."
            fi
          fi

          if [ -z "$reason" ] && [ -n "$unknown" ]; then
            # Lien public mais site de parcours non reconnu : relecture humaine, sans bloquer
            gh issue edit "$ISSUE" --remove-label "lien-vérifié" --remove-label "à-corriger" || true
            gh issue comment "$ISSUE" --body "🤖 Vérification automatique du lien : la page s'ouvre, mais $host n'est pas un site de parcours connu (OpenRunner, Komoot, RideWithGPS, Strava itinéraire, Visorando…). Un humain va vérifier qu'il s'agit bien d'un tracé."
            echo "Site non reconnu : $host"
          elif [ -z "$reason" ]; then
            gh issue edit "$ISSUE" --add-label "lien-vérifié" --remove-label "à-corriger" || gh issue edit "$ISSUE" --add-label "lien-vérifié"
            echo "Lien public ✔"
          else
            gh issue edit "$ISSUE" --add-label "à-corriger" --remove-label "lien-vérifié" || gh issue edit "$ISSUE" --add-label "à-corriger"
            gh issue comment "$ISSUE" --body "🤖 Vérification automatique du lien : $reason

          Vous pouvez modifier le ticket avec un lien public : la vérification sera relancée."
            echo "Lien refusé : $reason"
          fi
